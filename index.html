<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mon expérience dans la musique — v0.1</title>

<style>

/* =========================================================
   MON EXPÉRIENCE DANS LA MUSIQUE
   V0.1 — GRILLE STATIQUE

   MASTER : 1080 × 1920
   TEMPO  : 124 BPM
   DURÉE  : 02:41

   SAFE ZONE :
   gauche : 80 px
   droite : 180 px
   haut   : 90 px
   bas    : 220 px

   RÈGLE :
   - toute l'interface reste dans la safe zone
   - tous les cadres restent dans la safe zone
   - seuls les contenus futurs des cadres pourront
     être recadrés à l'intérieur de ceux-ci
   ========================================================= */


/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;

    width: 100%;
    height: 100%;

    background: #d8d8d8;

    overflow: hidden;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;
}


/* =========================================================
   VIEWPORT
   ========================================================= */

.viewport {
    width: 100vw;
    height: 100vh;

    display: flex;

    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* =========================================================
   MASTER 1080 × 1920
   ========================================================= */

#film {
    position: relative;

    width: 1080px;
    height: 1920px;

    flex: 0 0 auto;

    background: #f4f2ed;
    color: #111;

    overflow: hidden;

    transform-origin: center center;
}


/* =========================================================
   SIGNATURE
   ========================================================= */

.signature {
    position: absolute;

    top: 20px;
    left: 20px;

    font-size: 14px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    opacity: 0.45;
}


/* =========================================================
   VERSION
   ========================================================= */

.version {
    position: absolute;

    right: 20px;
    bottom: 20px;

    font-size: 14px;

    letter-spacing: 1px;

    opacity: 0.35;
}


/* =========================================================
   SAFE AREA

   Largeur :
   1080 - 80 - 180 = 820 px
   ========================================================= */

.safe-area {
    position: absolute;

    left: 80px;
    right: 180px;

    top: 90px;
    bottom: 220px;

    min-width: 0;

    display: grid;

    grid-template-rows:
        80px
        minmax(0, 1fr)
        290px
        150px;

    gap: 28px;
}


/* Toutes les sections structurelles
   sont strictement limitées à la safe zone */

.metadata,
.archive-zone,
.script-zone,
.audio-zone {
    width: 100%;
    max-width: 100%;

    min-width: 0;
}


/* =========================================================
   01 — HEADER
   ========================================================= */

.metadata {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    column-gap: 30px;

    align-items: start;

    overflow: hidden;

    border-top: 2px solid #111;

    padding-top: 15px;

    font-size: 20px;

    letter-spacing: 1.6px;

    text-transform: uppercase;
}

.metadata > * {
    min-width: 0;
}

.metadata-title {
    white-space: nowrap;
}

.metadata-right {
    text-align: right;

    white-space: nowrap;

    font-size: 18px;
}


/* =========================================================
   02 — ARCHIVE ZONE

   IMPORTANT :
   tous les CADRES restent dans les 820 px.
   ========================================================= */

.archive-zone {
    position: relative;

    overflow: hidden;

    border-top: 1px solid #aaa;
    border-bottom: 1px solid #aaa;
}


/* =========================================================
   IMAGE MAJEURE
   ========================================================= */

.main-image {
    position: absolute;

    left: 0;
    top: 70px;

    width: 520px;
    height: 600px;

    border: 2px solid #111;

    background: #e9e7e1;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    z-index: 1;

    font-size: 28px;

    letter-spacing: 2px;
}

.main-image::before {
    content: "01 / IMAGE";

    position: absolute;

    left: 0;
    top: 0;

    transform: translateY(-34px);

    font-size: 17px;

    letter-spacing: 2px;
}


/* Label séparé car le cadre lui-même
   utilise overflow:hidden */

.image-label {
    position: absolute;

    left: 0;
    top: 36px;

    z-index: 5;

    font-size: 17px;

    letter-spacing: 2px;
}


/* =========================================================
   DOCUMENT
   ========================================================= */

.document {
    position: absolute;

    right: 0;
    top: 150px;

    width: 220px;
    height: 450px;

    border: 2px solid #111;

    background: #dedcd6;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    z-index: 1;

    font-size: 22px;

    letter-spacing: 1.5px;
}

.document-label {
    position: absolute;

    right: 0;
    top: 116px;

    width: 220px;

    z-index: 5;

    font-size: 17px;

    letter-spacing: 2px;
}


/* =========================================================
   VIDEO

   Superposée au coin inférieur droit
   de l'image majeure.

   Le cadre reste entièrement dans
   la safe zone.
   ========================================================= */

.video {
    position: absolute;

    left: 320px;
    top: 500px;

    width: 500px;
    height: 281px;

    border: 2px solid #111;

    background: #222;
    color: #f4f2ed;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    z-index: 3;

    font-size: 28px;

    letter-spacing: 2px;
}

.video-label {
    position: absolute;

    left: 320px;
    top: 466px;

    z-index: 5;

    font-size: 17px;

    letter-spacing: 2px;
}


/* =========================================================
   FUTURS MÉDIAS

   Lorsqu'on ajoutera les vraies images/vidéos,
   elles seront recadrées DANS les cadres.

   Exemple :

   <img src="..." class="media">

   ========================================================= */

.media {
    position: absolute;

    width: 100%;
    height: 100%;

    inset: 0;

    object-fit: cover;
}


/* =========================================================
   03 — NARRATION
   ========================================================= */

.script-zone {
    position: relative;

    overflow: hidden;

    border-top: 2px solid #111;

    padding-top: 30px;
}

.script-label {
    margin-bottom: 24px;

    font-size: 17px;

    letter-spacing: 2px;

    text-transform: uppercase;
}

.script-text {
    width: 100%;

    min-width: 0;

    font-size: 48px;

    line-height: 1.08;

    letter-spacing: -1px;

    font-weight: 600;

    text-transform: uppercase;
}


/* =========================================================
   04 — AUDIO
   ========================================================= */

.audio-zone {
    position: relative;

    overflow: hidden;

    border-top: 2px solid #111;

    padding-top: 16px;
}


/* =========================================================
   AUDIO METADATA

   Les deux informations doivent toujours
   rester visibles.
   ========================================================= */

.audio-meta {
    width: 100%;

    min-width: 0;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    column-gap: 24px;

    align-items: start;

    margin-bottom: 20px;

    font-size: 16px;

    letter-spacing: 1.5px;
}

.audio-meta > * {
    min-width: 0;
}

.audio-time {
    white-space: nowrap;

    text-align: right;
}


/* =========================================================
   PLACEHOLDER AUDIOGRAM

   Pas encore le spectrogramme final.
   ========================================================= */

.waveform {
    position: relative;

    width: 100%;
    max-width: 100%;

    height: 55px;

    display: flex;

    align-items: center;

    gap: 4px;

    overflow: hidden;
}

.bar {
    width: 6px;

    flex: 0 0 6px;

    background: #111;
}


/* =========================================================
   PLAYHEAD
   ========================================================= */

.playhead {
    position: absolute;

    left: 42%;

    top: 48px;

    width: 2px;
    height: 75px;

    background: #111;

    opacity: 0.7;
}


/* =========================================================
   DEBUG SAFE ZONE

   Pour afficher la safe zone :
   <main id="film" class="debug">
   ========================================================= */

#film.debug::after {
    content: "";

    position: absolute;

    left: 80px;
    right: 180px;

    top: 90px;
    bottom: 220px;

    border: 2px dashed rgba(255, 0, 0, 0.45);

    pointer-events: none;

    z-index: 999;
}

</style>

</head>


<body>


<div class="viewport">


<main id="film">


    <!-- SIGNATURE -->

    <div class="signature">
        THOMAS BIZIEN
    </div>


    <!-- VERSION -->

    <div class="version">
        V0.1
    </div>


    <!-- =====================================================
         SAFE AREA
         ===================================================== -->

    <div class="safe-area">


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="metadata">

            <div class="metadata-title">
                MON EXPÉRIENCE DANS LA MUSIQUE
            </div>

            <div class="metadata-right">
                ARCHIVE_0037<br>
                2004
            </div>

        </header>


        <!-- =================================================
             ARCHIVES
             ================================================= -->

        <section class="archive-zone">


            <!-- IMAGE -->

            <div class="image-label">
                01 / IMAGE
            </div>

            <div class="main-image">
                IMAGE MAJEURE
            </div>


            <!-- DOCUMENT -->

            <div class="document-label">
                02 / DOCUMENT
            </div>

            <div class="document">
                DOCUMENT
            </div>


            <!-- VIDEO -->

            <div class="video-label">
                03 / VIDEO
            </div>

            <div class="video">
                VIDEO SD
            </div>


        </section>


        <!-- =================================================
             SCRIPT
             ================================================= -->

        <section class="script-zone">

            <div class="script-label">
                04 / NARRATION
            </div>

            <div class="script-text">
                J'AI COMMENCÉ LA MUSIQUE<br>
                PAR LA BASSE.
            </div>

        </section>


        <!-- =================================================
             AUDIO
             ================================================= -->

        <section class="audio-zone">


            <div class="audio-meta">

                <span>
                    AUDIO / 124 BPM
                </span>

                <span class="audio-time">
                    00:48.22 / 02:41.00
                </span>

            </div>


            <div
                class="waveform"
                id="waveform"
            ></div>


            <div class="playhead"></div>


        </section>


    </div>


</main>


</div>


<script>

/* =========================================================
   SCALE

   Le master reste réellement à 1080 × 1920.
   ========================================================= */

function scaleFilm() {

    const film =
        document.getElementById("film");

    const masterWidth =
        1080;

    const masterHeight =
        1920;

    const scaleX =
        window.innerWidth / masterWidth;

    const scaleY =
        window.innerHeight / masterHeight;

    const scale =
        Math.min(scaleX, scaleY);

    film.style.transform =
        `scale(${scale})`;
}


window.addEventListener(
    "resize",
    scaleFilm
);


scaleFilm();



/* =========================================================
   AUDIOGRAMME PROVISOIRE

   Purement graphique.

   Le spectrogramme réel sera produit
   à la fin à partir du mix voix + musique.
   ========================================================= */

const waveform =
    document.getElementById("waveform");


const heights = [

    12,18,26,38,52,31,20,44,55,36,
    22,16,29,48,54,41,25,19,33,51,

    42,28,17,23,39,55,46,30,21,14,
    28,43,52,36,24,18,31,49,55,40,

    27,16,25,38,50,44,32,20,14,29,
    47,55,39,25,17,30,42,51,35,22,

    15,27,46,53,37,24,18,32,48,41,
    26,16,23,39,54,45,31,20,14,28,

    43,52,36,24,17,30,49,55,40,27,

    18,30,47,52,34,22,16,29,45,53,
    38,24,19,33,48,42,27,17,26,41,

    31,48,54,39,23,16,27,43,51,35,
    21,15,29,46,55,37,24,18,33,49

];


heights.forEach(height => {

    const bar =
        document.createElement("div");

    bar.className =
        "bar";

    bar.style.height =
        height + "px";

    waveform.appendChild(bar);

});

</script>


</body>

</html>
