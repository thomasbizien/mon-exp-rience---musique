<script>

/* =========================================================

const BPM = 124;

const BEAT = 60 / BPM;

const REFERENCE_DURATION = 161;

/* =========================================================
   SCALE 1080 × 1920
   ========================================================= */

function scaleFilm() {

        window.innerHeight / 1920;

    const scale =

}

window.addEventListener(

/* =========================================================

    22,16,29,48,54,41,25,19,33,51,

    42,28,17,23,39,55,46,30,21,14,

    47,55,39,25,17,30,42,51,35,22,

    15,27,46,53,37,24,18,32,48,41,
    26,16,23,39,54,45,31,20,14,28,

    43,52,36,24,17,30,49,55,40,27,

    18,30,47,52,34,22,16,29,45,53,
    38,24,19,33,48,42,27,17,26,41,

/* =========================================================

];


/* =========================================================
   NARRATION ACTIVE
   ========================================================= */

let narrationIndex = -1;


function updateNarration(time) {

    let newIndex = 0;

    for (
        let i = 0;
        i < narration.length;
        i++
    ) {

        if (
            time >= narration[i].start
        ) {

            newIndex = i;

        } else {

            break;

        }

    }


    if (
        newIndex === narrationIndex
    ) {
        return;
    }


    narrationIndex =
        newIndex;


    const newText =
        narration[newIndex].text;


    gsap.to(
        scriptText,
        {
            opacity: 0,
            y: -8,

            duration: .12,

            overwrite: true,

            onComplete: () => {

                scriptText.innerHTML =
                    newText;


                gsap.set(
                    scriptText,
                    {
                        y: 10
                    }
                );


                gsap.to(
                    scriptText,
                    {
                        opacity: 1,
                        y: 0,

                        duration: .22,

                        ease: "power2.out"
                    }
                );

            }

        }
    );

}


/* =========================================================
   ANIMATION DES FENÊTRES

   IMPORTANT :
   On ne dépend PLUS d'une timeline GSAP externe.

   L'état visuel est calculé directement
   à partir de audio.currentTime.

   Donc si le son est à 34.2 secondes,
   l'image correspond forcément à 34.2 secondes.
   ========================================================= */

function updateWindows(time) {

    /*
       Mouvement très lent.

       Les trois valeurs utilisent des phases
       différentes pour éviter un mouvement
       mécanique parfaitement synchrone.
    */

    const imageWave =
        Math.sin(time * 0.45);


    const documentWave =
        Math.sin(time * 0.37 + 1.8);


    const videoWave =
        Math.sin(time * 0.41 + 3.1);


    /* ------------------------------------------------------
       IMAGE
       ------------------------------------------------------ */

    const imageScale =
        1 + imageWave * 0.018;


    const imageX =
        imageWave * 8;


    const imageY =
        Math.cos(time * 0.31) * 5;


    mainImage.style.transform =
        `translate(${imageX}px, ${imageY}px)
         scale(${imageScale})`;


    /* ------------------------------------------------------
       DOCUMENT
       ------------------------------------------------------ */

    const documentScale =
        1 + documentWave * 0.022;


    const documentX =
        documentWave * 7;


    const documentY =
        Math.cos(time * 0.27 + 1) * 8;


    documentWindow.style.transform =
        `translate(${documentX}px, ${documentY}px)
         scale(${documentScale})`;


    /* ------------------------------------------------------
       VIDEO

       Mouvement légèrement plus sensible.
       ------------------------------------------------------ */

    const videoScale =
        1 + videoWave * 0.025;


    const videoX =
        videoWave * 10;


    const videoY =
        Math.cos(time * 0.35 + 2) * 7;


    videoWindow.style.transform =
        `translate(${videoX}px, ${videoY}px)
         scale(${videoScale})`;

}


/* =========================================================
   TIMECODE
   ========================================================= */

function formatTime(seconds) {

    if (
        !Number.isFinite(seconds) ||
        seconds < 0
    ) {
        seconds = 0;
    }


    const minutes =
        Math.floor(seconds / 60);


    const secs =
        Math.floor(seconds % 60);


    const hundredths =
        Math.floor(
            (seconds % 1) * 100
        );


    return (
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(secs).padStart(2, "0")
        +
        "."
        +
        String(hundredths).padStart(2, "0")
    );

}


/* =========================================================
   DURÉE
   ========================================================= */

function getDuration() {

    if (
        Number.isFinite(audio.duration) &&
        audio.duration > 0
    ) {

        return audio.duration;

    }

    return REFERENCE_DURATION;

}


/* =========================================================
   UPDATE GLOBAL

   Cette fonction ne dépend pas du PLAY pour fonctionner.
   Elle tourne en permanence.

   Cela simplifie énormément la synchronisation.
   ========================================================= */

function updateFilm() {

    const time =
        Number.isFinite(audio.currentTime)
            ? audio.currentTime
            : 0;


    const duration =
        getDuration();


    /* TIMECODE */

    audioTime.textContent =
        `${formatTime(time)} / ${formatTime(duration)}`;


    /* PLAYHEAD */

    const progress =
        Math.max(
            0,
            Math.min(
                1,
                time / duration
            )
        );


    playhead.style.left =
        `${progress * waveform.clientWidth}px`;


    /* NARRATION */

    updateNarration(time);


    /* FENÊTRES */

    updateWindows(time);


    requestAnimationFrame(
        updateFilm
    );

}

   ========================================================= */

pauseButton.addEventListener(
    "click",
    () => {

        audio.pause();

    }
);


/* =========================================================
   RESTART
   ========================================================= */

restartButton.addEventListener(
    "click",
    async () => {

        audio.pause();

        audio.currentTime = 0;

        narrationIndex = -1;


        try {

            await audio.play();

        }

        catch (error) {

            console.error(
                "RESTART ERROR",
                error
            );

        }

    }
);


/* =========================================================
   SCRUB

   Clic sur l'audiogramme =
   déplacement dans le morceau.
   ========================================================= */

waveform.addEventListener(
    "click",
    event => {

        const rect =
            waveform.getBoundingClientRect();


        const x =
            event.clientX - rect.left;


        const ratio =
            Math.max(
                0,
                Math.min(
                    1,
                    x / rect.width
                )
            );


        audio.currentTime =
            ratio * getDuration();


        narrationIndex =
            -1;

    }
);


/* =========================================================
   LANCEMENT DU MOTEUR VISUEL
   ========================================================= */

requestAnimationFrame(
    updateFilm
);

</script>

</body>
</html>
