/* =========================================================

   ========================================================= */

   SIGNATURE
   ========================================================= */

.signature {

    left: 20px;

    font-size: 14px;

    letter-spacing: 1.5px;

/* =========================================================
   VERSION
   ========================================================= */

.version {

/* =========================================================
   SAFE AREA

.safe-area {

    right: 120px;

    top: 90px;
    bottom: 220px;

    min-width: 0;

    display: grid;

    grid-template-rows:

        minmax(0, 1fr)
        290px
        150px;

    gap: 28px;
}


.metadata,
.archive-zone,
.script-zone,
.audio-zone {
    width: 100%;
    max-width: 100%;

    min-width: 0;
}


/* =========================================================
   01 — HEADER
   ========================================================= */

.metadata {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    column-gap: 30px;

    align-items: start;

    overflow: hidden;

    border-top: 2px solid #111;

    padding-top: 15px;

    font-size: 20px;

    letter-spacing: 1.6px;

    text-transform: uppercase;
}


.metadata > * {
    min-width: 0;
}


.metadata-title {

}


.metadata-right {
    text-align: right;

    white-space: nowrap;

}


/* =========================================================
   02 — ARCHIVE ZONE
   ========================================================= */

.archive-zone {

    border-top: 1px solid #aaa;
    border-bottom: 1px solid #aaa;
}


/* =========================================================
   V0.2 — CLASSE COMMUNE DES FENÊTRES
   ========================================================= */

.window {
    transform-origin: center center;

    will-change:

        width,
        height,
        left,
        top,
        opacity;

.image-label {

    top: 36px;

    z-index: 10;

    letter-spacing: 2px;
}


/* =========================================================
   DOCUMENT

   ========================================================= */

.document {

    right: 0;
    top: 150px;

    width: 220px;
    height: 450px;

    font-size: 17px;

/* =========================================================

.video-label {

/* =========================================================
   CONTENU INTERNE DES FENÊTRES

   Le cadre peut changer de taille.

   Son contenu peut simultanément :
   - zoomer
   - se déplacer
   - être recadré

.media-placeholder {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    justify-content: center;

   <img class="media" src="...">

   ========================================================= */

.media {

    height: 100%;

<script>

/* =========================================================
   SCALE

   Le master reste toujours en 1080 × 1920.

   Le navigateur ne fait que réduire
   son affichage.
   ========================================================= */

function scaleFilm() {

    const film =
        document.getElementById("film");


    const masterWidth =
        1080;


    const masterHeight =
        1920;


    const scaleX =
        window.innerWidth / masterWidth;


    const scaleY =
        window.innerHeight / masterHeight;


    const scale =
        Math.min(scaleX, scaleY);


    film.style.transform =
        `scale(${scale})`;
}


window.addEventListener(
    "resize",
    scaleFilm
);


scaleFilm();



/* =========================================================
   AUDIOGRAMME PROVISOIRE

   Purement graphique.

   Le vrai spectrogramme sera ajouté
   après le mix voix + musique.
   ========================================================= */

const waveform =
    document.getElementById("waveform");


const heights = [

    12,18,26,38,52,31,20,44,55,36,
    22,16,29,48,54,41,25,19,33,51,

    42,28,17,23,39,55,46,30,21,14,
    28,43,52,36,24,18,31,49,55,40,

    27,16,25,38,50,44,32,20,14,29,
    47,55,39,25,17,30,42,51,35,22,

    15,27,46,53,37,24,18,32,48,41,
    26,16,23,39,54,45,31,20,14,28,

    43,52,36,24,17,30,49,55,40,27,

    18,30,47,52,34,22,16,29,45,53,
    38,24,19,33,48,42,27,17,26,41,

    31,48,54,39,23,16,27,43,51,35,
    21,15,29,46,55,37,24,18,33,49

];


heights.forEach(height => {

    const bar =
        document.createElement("div");


    bar.className =
        "bar";


    bar.style.height =
        height + "px";


    waveform.appendChild(bar);

});



/* =========================================================
   V0.2
   TEMPO / TIMING
   ========================================================= */

/*
   124 BPM

   1 temps :
   60 / 124
   ≈ 0.48387 seconde

   1 mesure 4/4 :
   0.48387 × 4
   ≈ 1.93548 seconde

   8 mesures :
   ≈ 15.48387 secondes
*/


const BEAT =
    60 / 124;


const BAR =
    BEAT * 4;



/* =========================================================
   TIMELINE V0.2

   Elle est PAUSED au chargement.

   Un clic sur le film lance ou relance

   ========================================================= */

const demo =

        defaults: {

/* =========================================================

   La grille ne bouge pratiquement pas.

   ========================================================= */

    ".main-image .media-placeholder",
    {
        scale: 1.04,

        duration: BAR * 2,

        ease: "sine.inOut"
    },
    0

    ".video .media-placeholder",

        duration: BAR * 2,

        ease: "sine.inOut"
    },
    0
);

    ".document .media-placeholder",
    {

        duration: BAR * 2,

        ease: "sine.inOut"
    },
    0

/* =========================================================

   Toutes les fenêtres restent

   ========================================================= */

    {
        width: 580,
        height: 640,

const audio = document.getElementById("masterAudio");
const audioTime = document.querySelector(".audio-time");
const playhead = document.querySelector(".playhead");
const scriptText = document.querySelector(".script-text");
const playIndicator = document.querySelector(".play-indicator");
const audioStatus = document.getElementById("audioStatus");
const playButton = document.getElementById("playButton");
const pauseButton = document.getElementById("pauseButton");
const restartButton = document.getElementById("restartButton");
const motifDuration = BAR * 8;
let narrationIndex = -1;
let frame = null;
let pendingSeek = null;
let playRequest = 0;

function duration() {
    return Number.isFinite(audio.duration) && audio.duration > 0
        ? audio.duration : REFERENCE_DURATION;
}

function timecode(seconds) {
    const ticks = Math.floor(Math.max(0, seconds) * 100 + 0.000001);
    return `${String(Math.floor(ticks / 6000)).padStart(2, "0")}:${String(Math.floor(ticks / 100) % 60).padStart(2, "0")}.${String(ticks % 100).padStart(2, "0")}`;
}

function sync() {
    const time = Math.max(0, Math.min(audio.currentTime || 0, duration()));
    // Un accès direct à un instant donne le même état que la lecture continue.
    demo.pause().time(time % motifDuration, true);
    audioTime.textContent = `${timecode(time)} / ${timecode(duration())}`;
    playhead.style.left = `${(time / duration()) * Math.max(0, waveform.clientWidth - playhead.offsetWidth)}px`;
    waveform.setAttribute("aria-valuemax", String(duration()));
    waveform.setAttribute("aria-valuenow", String(time));
    waveform.setAttribute("aria-valuetext", `${timecode(time)} sur ${timecode(duration())}`);
    let index = 0;
    for (let i = 1; i < narration.length && narration[i].start <= time; i++) index = i;
    if (index !== narrationIndex) {
        narrationIndex = index;
        const lines = narration[index].text.split("|");
        scriptText.replaceChildren();
        lines.forEach((line, i) => {
            if (i) scriptText.appendChild(document.createElement("br"));
            scriptText.appendChild(document.createTextNode(line));
        });
    }
    playIndicator.style.opacity = audio.paused || audio.ended ? "0" : "0.45";
    playButton.setAttribute("aria-pressed", String(!audio.paused && !audio.ended));
}

function stopFrames() {
    if (frame !== null) cancelAnimationFrame(frame);
    frame = null;
}

function tick() {
    frame = null;
    sync();
    if (!audio.paused && !audio.ended) frame = requestAnimationFrame(tick);
}

async function play() {
    const request = ++playRequest;
    audioStatus.textContent = "";
    if (audio.ended) seek(0);
    try {
        await audio.play();
        if (request !== playRequest) return;
        sync();
    } catch (error) {
        if (request !== playRequest || error.name === "AbortError") return;
        audioStatus.textContent = "Lecture impossible : vérifiez maquette.mp3 à côté de index.html, puis cliquez sur PLAY.";
        sync();
    }
}

function pause() {
    ++playRequest;
    audio.pause();
    stopFrames();
    sync();
}

function seek(seconds) {
    const target = Math.max(0, Math.min(seconds, duration()));
    if (audio.readyState === 0) {
        pendingSeek = target;
        audio.load();
        return;
    }
    pendingSeek = null;
    audio.currentTime = target;
    sync();
}

playButton.addEventListener("click", play);
pauseButton.addEventListener("click", pause);
restartButton.addEventListener("click", () => {
    pause();
    seek(0);
    play(); // RESTART reprend la lecture depuis le début.
});

audio.addEventListener("play", () => { stopFrames(); tick(); });
audio.addEventListener("pause", () => { stopFrames(); sync(); });
audio.addEventListener("ended", () => { stopFrames(); sync(); });
for (const event of ["timeupdate", "seeking", "seeked", "durationchange"])
    audio.addEventListener(event, sync);
audio.addEventListener("loadedmetadata", () => {
    if (pendingSeek !== null) seek(pendingSeek);
    sync();
});
audio.addEventListener("error", () => {
    stopFrames();
    audioStatus.textContent = "Audio introuvable ou illisible : placez maquette.mp3 à côté de index.html.";
    sync();
});

// Pointer Events : clic, glissement et tactile, même lorsque le master est réduit.
function seekFromPointer(event) {
    const rect = waveform.getBoundingClientRect();
    if (!rect.width) return;
    seek(Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)) * duration());
}
let dragging = false;
waveform.addEventListener("pointerdown", event => {
    if (event.button !== 0) return;
    dragging = true;
    waveform.setPointerCapture(event.pointerId);
    waveform.focus({ preventScroll:true });
    seekFromPointer(event);
});
waveform.addEventListener("pointermove", event => { if (dragging) seekFromPointer(event); });
waveform.addEventListener("pointerup", event => {
    if (dragging) seekFromPointer(event);
    dragging = false;
});
waveform.addEventListener("pointercancel", () => { dragging = false; });
waveform.addEventListener("lostpointercapture", () => { dragging = false; });
waveform.addEventListener("keydown", event => {
    const step = event.shiftKey ? 10 : 1;
    let target;
    if (event.key === "ArrowRight" || event.key === "ArrowUp") target = audio.currentTime + step;
    if (event.key === "ArrowLeft" || event.key === "ArrowDown") target = audio.currentTime - step;
    if (event.key === "Home") target = 0;
    if (event.key === "End") target = duration();
    if (target !== undefined) { event.preventDefault(); seek(target); }
});
window.addEventListener("resize", sync);
document.addEventListener("visibilitychange", sync);
sync();
</script>
