<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mon expérience dans la musique — V0.3</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #d8d8d8;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;
}


/* =========================================================
   VIEWPORT
   ========================================================= */

.viewport {
    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* =========================================================
   MASTER 1080 × 1920
   ========================================================= */

#film {
    position: relative;

    width: 1080px;
    height: 1920px;

    flex: 0 0 auto;

    background: #f4f2ed;
    color: #111;

    overflow: hidden;

    transform-origin: center center;
}


/* =========================================================
   SIGNATURE
   ========================================================= */

.signature {
    position: absolute;

    top: 20px;
    left: 20px;

    font-size: 14px;
    letter-spacing: 1.5px;

    text-transform: uppercase;

    opacity: .45;
}


.version {
    position: absolute;

    right: 20px;
    bottom: 20px;

    font-size: 14px;
    letter-spacing: 1px;

    opacity: .35;
}


/* =========================================================
   SAFE ZONE

   120 px GAUCHE
   120 px DROITE

   largeur utile = 840 px
   ========================================================= */

.safe-area {
    position: absolute;

    left: 120px;
    right: 120px;

    top: 90px;
    bottom: 220px;

    display: grid;

    grid-template-rows:
        80px
        minmax(0, 1fr)
        290px
        150px;

    gap: 28px;

    min-width: 0;
}


.metadata,
.archive-zone,
.script-zone,
.audio-zone {
    width: 100%;
    min-width: 0;
    max-width: 100%;
}


/* =========================================================
   HEADER
   ========================================================= */

.metadata {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    column-gap: 30px;

    align-items: start;

    border-top: 2px solid #111;

    padding-top: 15px;

    overflow: hidden;

    font-size: 20px;
    letter-spacing: 1.6px;

    text-transform: uppercase;
}


.metadata-title {
    white-space: nowrap;
}


.metadata-right {
    text-align: right;
    white-space: nowrap;

    font-size: 18px;
}


/* =========================================================
   ARCHIVES
   ========================================================= */

.archive-zone {
    position: relative;

    overflow: hidden;

    border-top: 1px solid #aaa;
    border-bottom: 1px solid #aaa;
}


/* =========================================================
   01 IMAGE
   ========================================================= */

.image-label {
    position: absolute;

    left: 0;
    top: 36px;

    z-index: 20;

    font-size: 17px;
    letter-spacing: 2px;
}


.main-image {
    position: absolute;

    left: 0;
    top: 70px;

    width: 520px;
    height: 600px;

    border: 2px solid #111;

    background: #e9e7e1;

    overflow: hidden;

    z-index: 1;
}


/* =========================================================
   02 DOCUMENT
   ========================================================= */

.document-label {
    position: absolute;

    right: 0;
    top: 116px;

    width: 220px;

    z-index: 20;

    font-size: 17px;
    letter-spacing: 2px;
}


.document {
    position: absolute;

    right: 0;
    top: 150px;

    width: 220px;
    height: 450px;

    border: 2px solid #111;

    background: #dedcd6;

    overflow: hidden;

    z-index: 1;
}


/* =========================================================
   03 VIDEO
   ========================================================= */

.video-label {
    position: absolute;

    left: 300px;
    top: 451px;

    z-index: 20;

    font-size: 17px;
    letter-spacing: 2px;
}


.video {
    position: absolute;

    left: 300px;
    top: 485px;

    width: 540px;
    height: 330px;

    border: 2px solid #111;

    background: #222;
    color: #f4f2ed;

    overflow: hidden;

    z-index: 3;
}


/* =========================================================
   CONTENU DES FENÊTRES
   ========================================================= */

.media-placeholder {
    position: absolute;

    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    width: 100%;
    height: 100%;
}


.main-image .media-placeholder {
    font-size: 28px;
    letter-spacing: 2px;
}


.document .media-placeholder {
    font-size: 22px;
    letter-spacing: 1.5px;
}


.video .media-placeholder {
    font-size: 28px;
    letter-spacing: 2px;
}


.media {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
}


/* =========================================================
   NARRATION
   ========================================================= */

.script-zone {
    position: relative;

    border-top: 2px solid #111;

    padding-top: 30px;

    overflow: hidden;
}


.script-label {
    margin-bottom: 24px;

    font-size: 17px;
    letter-spacing: 2px;

    text-transform: uppercase;
}


.script-text {
    width: 100%;

    font-size: 48px;
    line-height: 1.08;

    letter-spacing: -1px;

    font-weight: 600;

    text-transform: uppercase;
}


/* =========================================================
   AUDIO
   ========================================================= */

.audio-zone {
    position: relative;

    border-top: 2px solid #111;

    padding-top: 16px;

    overflow: hidden;
}


.audio-meta {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    column-gap: 24px;

    margin-bottom: 20px;

    font-size: 16px;
    letter-spacing: 1.5px;
}


.audio-time {
    text-align: right;
    white-space: nowrap;
}


/* =========================================================
   WAVEFORM PLACEHOLDER
   ========================================================= */

.waveform {
    position: relative;

    width: 100%;
    height: 55px;

    display: flex;
    align-items: center;

    gap: 4px;

    overflow: hidden;

    cursor: pointer;
}


.bar {
    width: 6px;

    flex: 0 0 6px;

    background: #111;
}


/* =========================================================
   PLAYHEAD
   ========================================================= */

.playhead {
    position: absolute;

    left: 0;
    top: 48px;

    width: 2px;
    height: 75px;

    background: #111;

    opacity: .75;

    pointer-events: none;
}


/* =========================================================
   COMMANDES
   ========================================================= */

.controls {
    position: absolute;

    left: 20px;
    bottom: 45px;

    display: flex;

    gap: 8px;

    z-index: 100;
}


.control-button {
    padding: 8px 11px;

    border: 1px solid #111;

    background: transparent;
    color: #111;

    font-family: inherit;

    font-size: 13px;
    letter-spacing: 1.2px;

    cursor: pointer;
}


.control-button:hover {
    background: #111;
    color: #f4f2ed;
}


/* =========================================================
   DIAGNOSTIC AUDIO
   Invisible normalement.
   Visible uniquement en cas d'erreur.
   ========================================================= */

.status {
    position: absolute;

    left: 20px;
    bottom: 90px;

    max-width: 900px;

    font-size: 13px;
    letter-spacing: 1px;

    opacity: 0;

    z-index: 100;
}


.status.error {
    opacity: 1;
    font-weight: 600;
}

</style>
</head>


<body>

<div class="viewport">

<main id="film">


    <div class="signature">
        THOMAS BIZIEN
    </div>


    <div class="version">
        V0.3
    </div>


    <!-- =====================================================
         AUDIO
         
         IMPORTANT :
         maquette.mp3 est à la RACINE du dépôt.
         ===================================================== -->

    <audio
        id="masterAudio"
        preload="auto"
        src="maquette.mp3"
    ></audio>


    <div
        class="status"
        id="status"
    ></div>


    <!-- =====================================================
         COMMANDES
         ===================================================== -->

    <div class="controls">

        <button
            class="control-button"
            id="playButton"
        >
            ▶ PLAY
        </button>

        <button
            class="control-button"
            id="pauseButton"
        >
            Ⅱ PAUSE
        </button>

        <button
            class="control-button"
            id="restartButton"
        >
            ↺ RESTART
        </button>

    </div>


    <!-- =====================================================
         SAFE AREA
         ===================================================== -->

    <div class="safe-area">


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="metadata">

            <div class="metadata-title">
                MON EXPÉRIENCE DANS LA MUSIQUE
            </div>

            <div class="metadata-right">
                ARCHIVE_2007<br>
                2026
            </div>

        </header>


        <!-- =================================================
             ARCHIVES
             ================================================= -->

        <section class="archive-zone">


            <div class="image-label">
                01 / IMAGE
            </div>


            <div
                class="main-image"
                id="mainImage"
            >

                <div class="media-placeholder">
                    IMAGE MAJEURE
                </div>

            </div>


            <div class="document-label">
                02 / DOCUMENT
            </div>


            <div
                class="document"
                id="documentWindow"
            >

                <div class="media-placeholder">
                    DOCUMENT
                </div>

            </div>


            <div class="video-label">
                03 / VIDEO
            </div>


            <div
                class="video"
                id="videoWindow"
            >

                <div class="media-placeholder">
                    VIDEO SD
                </div>

            </div>


        </section>


        <!-- =================================================
             NARRATION
             ================================================= -->

        <section class="script-zone">

            <div class="script-label">
                04 / NARRATION
            </div>


            <div
                class="script-text"
                id="scriptText"
            >
                J'AI TOUJOURS RÊVÉ<br>
                D'ÊTRE BATTEUR.
            </div>

        </section>


        <!-- =================================================
             AUDIO
             ================================================= -->

        <section class="audio-zone">


            <div class="audio-meta">

                <span>
                    PARIS M'EMMERDE
                </span>


                <span
                    class="audio-time"
                    id="audioTime"
                >
                    00:00.00 / 02:41.00
                </span>

            </div>


            <div
                class="waveform"
                id="waveform"
            ></div>


            <div
                class="playhead"
                id="playhead"
            ></div>


        </section>


    </div>

</main>

</div>


<script>

/* =========================================================
   CONSTANTES
   ========================================================= */

const REFERENCE_DURATION = 161;


/* =========================================================
   ÉLÉMENTS
   ========================================================= */

const film =
    document.getElementById("film");

const audio =
    document.getElementById("masterAudio");

const playButton =
    document.getElementById("playButton");

const pauseButton =
    document.getElementById("pauseButton");

const restartButton =
    document.getElementById("restartButton");

const waveform =
    document.getElementById("waveform");

const playhead =
    document.getElementById("playhead");

const audioTime =
    document.getElementById("audioTime");

const scriptText =
    document.getElementById("scriptText");

const status =
    document.getElementById("status");

const mainImage =
    document.getElementById("mainImage");

const documentWindow =
    document.getElementById("documentWindow");

const videoWindow =
    document.getElementById("videoWindow");


/* =========================================================
   SCALE

   Le master reste réellement en 1080 × 1920.
   Seul son affichage est réduit.
   ========================================================= */

function scaleFilm() {

    const scaleX =
        window.innerWidth / 1080;

    const scaleY =
        window.innerHeight / 1920;

    const scale =
        Math.min(scaleX, scaleY);

    film.style.transform =
        `scale(${scale})`;
}


window.addEventListener(
    "resize",
    scaleFilm
);


scaleFilm();


/* =========================================================
   WAVEFORM PROVISOIRE
   ========================================================= */

const heights = [

    12,18,26,38,52,31,20,44,55,36,
    22,16,29,48,54,41,25,19,33,51,

    42,28,17,23,39,55,46,30,21,14,
    28,43,52,36,24,18,31,49,55,40,

    27,16,25,38,50,44,32,20,14,29,
    47,55,39,25,17,30,42,51,35,22,

    15,27,46,53,37,24,18,32,48,41,
    26,16,23,39,54,45,31,20,14,28,

    43,52,36,24,17,30,49,55,40,27,

    18,30,47,52,34,22,16,29,45,53,
    38,24,19,33,48,42,27,17,26,41,

    31,48,54,39,23,16,27,43,51,35,
    21,15,29,46,55,37,24,18,33,49

];


heights.forEach(height => {

    const bar =
        document.createElement("div");

    bar.className =
        "bar";

    bar.style.height =
        height + "px";

    waveform.appendChild(bar);

});


/* =========================================================
   SCRIPT / TIMELINE

   Timings encore provisoires.
   ========================================================= */

const narration = [

    {
        start: 0,
        text:
            "J'AI TOUJOURS RÊVÉ<br>D'ÊTRE BATTEUR."
    },

    {
        start: 6,
        text:
            "MAIS LES BATTEURS,<br>ÇA PREND DE LA PLACE."
    },

    {
        start: 12,
        text:
            "ET LE BRUIT..."
    },

    {
        start: 17.5,
        text:
            "À LA LONGUE,<br>PLUS PERSONNE FINIT<br>PAR NOUS BLAIRER."
    },

    {
        start: 23.5,
        text:
            "BASSISTE,<br>C'EST PLUS SIMPLE."
    },

    {
        start: 29,
        text:
            "LES GROUPES<br>NOUS RECHERCHENT."
    },

    {
        start: 34,
        text:
            "J'AI FAIT DU PUNK,<br>DU SURF-ROCK."
    },

    {
        start: 41,
        text:
            "ON A ÉTÉ SIGNÉS<br>PAR YAROL POUPAUD."
    },

    {
        start: 48,
        text:
            "UNE ÉQUIPE<br>DE BÉBÉS ROCKEURS."
    },

    {
        start: 53.5,
        text:
            "J'AI JOUÉ AVEC<br>DES GENS CONNUS."
    },

    {
        start: 59.5,
        text:
            "COMME<br>MICHEL GONDRY."
    },

    {
        start: 64,
        text:
            "CLARA LUCIANI M'A FAIT<br>TENIR LA BASSE."
    },

    {
        start: 70.5,
        text:
            "J'EN AVAIS MARRE<br>DES GENS CÉLÈBRES."
    },

    {
        start: 77,
        text:
            "J'AI DÉMISSIONNÉ."
    },

    {
        start: 82,
        text:
            "JE RESTAIS CHEZ MOI<br>AVEC MES COPINES."
    },

    {
        start: 89,
        text:
            "ON ENREGISTRAIT DES TRUCS<br>SOUS DES NOMS OBSCURS."
    },

    {
        start: 96,
        text:
            "LE NOM ÉVOLUAIT<br>EN FONCTION DES RUPTURES."
    },

    {
        start: 102.5,
        text:
            "TOUT LE MONDE S'EST MIS<br>À CHERCHER DU TRAVAIL."
    },

    {
        start: 109,
        text:
            "ON N'AVAIT PLUS LE TEMPS<br>D'AVOIR UN GROUPE."
    },

    {
        start: 115,
        text:
            "LA DISPARITION<br>DES GROUPES."
    },

    {
        start: 121,
        text:
            "ET PUIS LA MUSIQUE<br>EST REVENUE."
    },

    {
        start: 126,
        text:
            "MAIS LES GROUPES,<br>BEAUCOUP MOINS."
    },

    {
        start: 131,
        text:
            "UN TYPE TOUT SEUL<br>DERRIÈRE SES MACHINES."
    },

    {
        start: 137,
        text:
            "AVEC LA NOSTALGIE<br>DE L'ACOUSTIQUE."
    },

    {
        start: 142,
        text:
            "ALORS J'AI COMMENCÉ<br>À FAIRE AUTREMENT."
    },

    {
        start: 147,
        text:
            "À PRODUIRE SEUL.<br>À ENREGISTRER SEUL."
    },

    {
        start: 151,
        text:
            "MÉNAGE SAMEDI."
    },

    {
        start: 154,
        text:
            "AUSTRALOPUNCKTECH."
    },

    {
        start: 157,
        text:
            "ÉLECTRONIQUE<br>MÉLANCOLIQUE MUSIQUE."
    },

    {
        start: 159,
        text:
            "J'AI RECOMMENCÉ<br>À FAIRE DE LA MUSIQUE."
    }

];


/* =========================================================
   NARRATION ACTIVE
   ========================================================= */

let narrationIndex = -1;


function updateNarration(time) {

    let index = 0;


    for (
        let i = 0;
        i < narration.length;
        i++
    ) {

        if (
            time >= narration[i].start
        ) {

            index = i;

        }

        else {

            break;

        }

    }


    if (
        index === narrationIndex
    ) {

        return;

    }


    narrationIndex =
        index;


    scriptText.innerHTML =
        narration[index].text;

}


/* =========================================================
   ANIMATION DES TROIS FENÊTRES

   IMPORTANT :

   À T = 0 :
   transform = none.

   Le cadrage reste donc EXACTEMENT celui
   de la maquette validée.

   Les mouvements arrivent progressivement.
   ========================================================= */

function updateWindows(time) {

    if (time <= 0.05) {

        mainImage.style.transform =
            "none";

        documentWindow.style.transform =
            "none";

        videoWindow.style.transform =
            "none";

        return;

    }


    /*
       Entrée progressive de l'animation
       pendant les deux premières secondes.
    */

    const entrance =
        Math.min(
            1,
            time / 2
        );


    /* IMAGE */

    const imageX =
        Math.sin(time * 0.31)
        * 5
        * entrance;

    const imageY =
        Math.sin(time * 0.23)
        * 4
        * entrance;

    const imageScale =
        1 +
        Math.sin(time * 0.19)
        * 0.008
        * entrance;


    mainImage.style.transform =
        `translate(
            ${imageX}px,
            ${imageY}px
        )
        scale(${imageScale})`;


    /* DOCUMENT */

    const documentX =
        Math.sin(time * 0.27 + 1)
        * 4
        * entrance;

    const documentY =
        Math.sin(time * 0.21 + 1.4)
        * 5
        * entrance;

    const documentScale =
        1 +
        Math.sin(time * 0.17 + 2)
        * 0.009
        * entrance;


    documentWindow.style.transform =
        `translate(
            ${documentX}px,
            ${documentY}px
        )
        scale(${documentScale})`;


    /* VIDEO */

    const videoX =
        Math.sin(time * 0.29 + 2)
        * 5
        * entrance;

    const videoY =
        Math.sin(time * 0.25 + 3)
        * 4
        * entrance;

    const videoScale =
        1 +
        Math.sin(time * 0.18 + 1)
        * 0.008
        * entrance;


    videoWindow.style.transform =
        `translate(
            ${videoX}px,
            ${videoY}px
        )
        scale(${videoScale})`;

}


/* =========================================================
   FORMAT TIMECODE
   ========================================================= */

function formatTime(seconds) {

    if (
        !Number.isFinite(seconds)
    ) {

        seconds = 0;

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    const hundredths =
        Math.floor(
            (seconds % 1) * 100
        );


    return (
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(secs).padStart(2, "0")
        +
        "."
        +
        String(hundredths).padStart(2, "0")
    );

}


/* =========================================================
   DURÉE
   ========================================================= */

function getDuration() {

    if (
        Number.isFinite(audio.duration)
        &&
        audio.duration > 0
    ) {

        return audio.duration;

    }


    return REFERENCE_DURATION;

}


/* =========================================================
   MOTEUR PRINCIPAL
   ========================================================= */

function updateFilm() {

    const time =
        Number.isFinite(audio.currentTime)
            ? audio.currentTime
            : 0;


    const duration =
        getDuration();


    /* TIMECODE */

    audioTime.textContent =
        formatTime(time)
        +
        " / "
        +
        formatTime(duration);


    /* PLAYHEAD */

    const progress =
        Math.max(
            0,
            Math.min(
                1,
                time / duration
            )
        );


    playhead.style.left =
        (
            progress
            *
            waveform.clientWidth
        )
        +
        "px";


    /* TEXTE */

    updateNarration(time);


    /* FENÊTRES */

    updateWindows(time);


    requestAnimationFrame(
        updateFilm
    );

}


/* =========================================================
   AUDIO EVENTS
   ========================================================= */

audio.addEventListener(
    "error",
    () => {

        status.textContent =
            "ERREUR AUDIO : maquette.mp3";

        status.classList.add(
            "error"
        );

        console.error(
            "Erreur audio :",
            audio.error
        );

    }
);


audio.addEventListener(
    "loadedmetadata",
    () => {

        console.log(
            "Audio chargé :",
            audio.duration,
            "secondes"
        );

    }
);


/* =========================================================
   PLAY
   ========================================================= */

playButton.addEventListener(
    "click",
    () => {

        const promise =
            audio.play();


        if (
            promise !== undefined
        ) {

            promise.catch(
                error => {

                    status.textContent =
                        "LECTURE AUDIO IMPOSSIBLE";

                    status.classList.add(
                        "error"
                    );


                    console.error(
                        "Erreur PLAY :",
                        error
                    );

                }
            );

        }

    }
);


/* =========================================================
   PAUSE
   ========================================================= */

pauseButton.addEventListener(
    "click",
    () => {

        audio.pause();

    }
);


/* =========================================================
   RESTART
   ========================================================= */

restartButton.addEventListener(
    "click",
    () => {

        audio.pause();

        audio.currentTime = 0;

        narrationIndex = -1;


        mainImage.style.transform =
            "none";

        documentWindow.style.transform =
            "none";

        videoWindow.style.transform =
            "none";


        audio.play().catch(
            error => {

                console.error(
                    error
                );

            }
        );

    }
);


/* =========================================================
   SCRUB SUR WAVEFORM
   ========================================================= */

waveform.addEventListener(
    "click",
    event => {

        const rect =
            waveform.getBoundingClientRect();


        const x =
            event.clientX
            -
            rect.left;


        const ratio =
            Math.max(
                0,
                Math.min(
                    1,
                    x / rect.width
                )
            );


        audio.currentTime =
            ratio
            *
            getDuration();


        narrationIndex =
            -1;

    }
);


/* =========================================================
   INITIALISATION

   IMPORTANT :
   aucun déplacement des fenêtres au chargement.
   ========================================================= */

mainImage.style.transform =
    "none";

documentWindow.style.transform =
    "none";

videoWindow.style.transform =
    "none";


requestAnimationFrame(
    updateFilm
);

</script>

</body>
</html>
