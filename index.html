/* RESET */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

/* VIEWPORT */

.viewport {
    width: 100vw;
    height: 100vh;

    overflow: hidden;

    bottom: 20px;

    right: 120px;

    bottom: 220px;

    display: grid;

.metadata,

.metadata {

}

.metadata-right {

/* ÉLÉMENTS */

const audio = document.getElementById("masterAudio");
const audioTime = document.querySelector(".audio-time");
const playhead = document.querySelector(".playhead");

/* DURÉE RÉELLE DU MP3 */

function duration() {
    return Number.isFinite(audio.duration) && audio.duration > 0
        ? audio.duration
        : REFERENCE_DURATION;
}

/* TIMECODE MM:SS.CC */

function timecode(seconds) {
    const ticks = Math.floor(
        Math.max(0, seconds) * 100 + 0.000001
    );

    const minutes = String(
        Math.floor(ticks / 6000)
    ).padStart(2, "0");

    const secs = String(
        Math.floor(ticks / 100) % 60
    ).padStart(2, "0");

    const hundredths = String(
        ticks % 100
    ).padStart(2, "0");

    return `${minutes}:${secs}.${hundredths}`;
}

/* =========================================================

   audio.currentTime pilote :
   - la timeline GSAP ;
   - le timecode ;
   - le playhead ;
   - le bloc de narration.

function sync() {
    const time = Math.max(
        0,
        Math.min(audio.currentTime || 0, duration())
    );

    demo.pause().time(
        time % motifDuration,
        true
    );

    audioTime.textContent =

    const playheadTravel = Math.max(
        0,
        waveform.clientWidth - playhead.offsetWidth
    );

    playhead.style.left =
        `${(time / duration()) * playheadTravel}px`;

    waveform.setAttribute(
        "aria-valuemax",
        String(duration())
    );

    waveform.setAttribute(
        "aria-valuenow",
        String(time)
    );

    waveform.setAttribute(
        "aria-valuetext",
        `${timecode(time)} sur ${timecode(duration())}`
    );

    let index = 0;

    for (
        let i = 1;
        i < narration.length && narration[i].start <= time;
        i++
    ) {
        index = i;
    }

    if (index !== narrationIndex) {
        narrationIndex = index;

        const lines = narration[index].text.split("|");

        scriptText.replaceChildren();

        lines.forEach((line, i) => {
            if (i) {
                scriptText.appendChild(
                    document.createElement("br")
                );
            }

            scriptText.appendChild(
                document.createTextNode(line)
            );
        });
    }

    playIndicator.style.opacity =
        audio.paused || audio.ended ? "0" : "0.45";

    playButton.setAttribute(
        "aria-pressed",
        String(!audio.paused && !audio.ended)
    );
}

/* BOUCLE D’AFFICHAGE */

function stopFrames() {
    if (frame !== null) {
        cancelAnimationFrame(frame);
    }

    frame = null;
}

function tick() {
    frame = null;

    sync();

    if (!audio.paused && !audio.ended) {
        frame = requestAnimationFrame(tick);
    }
}

/* PLAY */

async function play() {
    const request = ++playRequest;

    audioStatus.textContent = "";

    if (audio.ended) {
        seek(0);
    }

    try {
        await audio.play();

        if (request !== playRequest) {
            return;
        }

        sync();
    } catch (error) {
        if (
            request !== playRequest ||
            error.name === "AbortError"
        ) {
            return;
        }

        audioStatus.textContent =
            "Lecture impossible : vérifiez maquette.mp3 à côté de index.html, puis cliquez sur PLAY.";

        sync();
    }
}

/* PAUSE */

function pause() {
    ++playRequest;

    audio.pause();

    stopFrames();

    sync();
}

/* NAVIGATION TEMPORELLE */

function seek(seconds) {
    const target = Math.max(
        0,
        Math.min(seconds, duration())
    );

    if (audio.readyState === 0) {
        pendingSeek = target;

        audio.load();

        return;
    }

    pendingSeek = null;

    audio.currentTime = target;

    sync();
}

/* BOUTONS */

playButton.addEventListener("click", play);

pauseButton.addEventListener("click", pause);

restartButton.addEventListener("click", () => {
    pause();
    seek(0);

    // RESTART reprend la lecture depuis le début.
    play();
});

/* ÉVÉNEMENTS AUDIO */

audio.addEventListener("play", () => {
    stopFrames();
    tick();
});

audio.addEventListener("pause", () => {
    stopFrames();
    sync();
});

audio.addEventListener("ended", () => {
    stopFrames();
    sync();
});

for (
    const event of [
        "timeupdate",
        "seeking",
        "seeked",
        "durationchange"
    ]
) {
    audio.addEventListener(event, sync);
}

audio.addEventListener("loadedmetadata", () => {
    if (pendingSeek !== null) {
        seek(pendingSeek);
    }

    sync();
});

audio.addEventListener("error", () => {
    stopFrames();

    audioStatus.textContent =
        "Audio introuvable ou illisible : placez maquette.mp3 à côté de index.html.";

    sync();
});

/* =========================================================
   NAVIGATION PAR CLIC / GLISSEMENT / TACTILE

   getBoundingClientRect tient compte de la réduction
   du master à l’écran.
   ========================================================= */

function seekFromPointer(event) {
    const rect = waveform.getBoundingClientRect();

    if (!rect.width) {
        return;
    }

    const ratio = Math.max(
        0,
        Math.min(
            1,
            (event.clientX - rect.left) / rect.width
        )
    );

    seek(ratio * duration());
}

let dragging = false;

waveform.addEventListener("pointerdown", event => {
    if (event.button !== 0) {
        return;
    }

    dragging = true;

    waveform.setPointerCapture(event.pointerId);

    waveform.focus({
        preventScroll: true
    });

    seekFromPointer(event);
});

waveform.addEventListener("pointermove", event => {
    if (dragging) {
        seekFromPointer(event);
    }
});

waveform.addEventListener("pointerup", event => {
    if (dragging) {
        seekFromPointer(event);
    }

    dragging = false;
});

waveform.addEventListener("pointercancel", () => {
    dragging = false;
});

waveform.addEventListener("lostpointercapture", () => {
    dragging = false;
});

/* =========================================================
   NAVIGATION AU CLAVIER

   Flèches : ±1 seconde
   Maj + flèches : ±10 secondes
   Home : début
   End : fin
   ========================================================= */

waveform.addEventListener("keydown", event => {
    const step = event.shiftKey ? 10 : 1;

    let target;

    if (
        event.key === "ArrowRight" ||
        event.key === "ArrowUp"
    ) {
        target = audio.currentTime + step;
    }

    if (
        event.key === "ArrowLeft" ||
        event.key === "ArrowDown"
    ) {
        target = audio.currentTime - step;
    }

    if (event.key === "Home") {
        target = 0;
    }

    if (event.key === "End") {
        target = duration();
    }

    if (target !== undefined) {
        event.preventDefault();

        seek(target);
    }
});

/* INITIALISATION */

window.addEventListener("resize", sync);

document.addEventListener("visibilitychange", sync);

sync();

</script>
