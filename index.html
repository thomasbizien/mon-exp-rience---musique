/* =========================================================
   RESET
   ========================================================= */

* {

html,

    overflow: hidden;
}

   SAFE AREA

   ========================================================= */

.safe-area {
    position: absolute;

    right: 120px;

    top: 90px;
    bottom: 220px;

    min-width: 0;

    display: grid;

    grid-template-rows:
        80px
        minmax(0, 1fr)
        290px
        150px;

    gap: 28px;
}


.metadata,
.archive-zone,
.script-zone,
.audio-zone {
    width: 100%;
    max-width: 100%;

    min-width: 0;
}


/* =========================================================
   01 — HEADER
   ========================================================= */

.metadata {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    column-gap: 30px;

    align-items: start;

    overflow: hidden;

    border-top: 2px solid #111;

    padding-top: 15px;

    letter-spacing: 1.6px;

/* =========================================================
   CLASSE COMMUNE DES FENÊTRES
   ========================================================= */

.window {

/* =========================================================

<script>

/* =========================================================
   V0.3
   CONFIGURATION GÉNÉRALE
   ========================================================= */

const BPM = 124;

const BEAT =
    60 / BPM;

const BAR =
    BEAT * 4;


/*
   Durée graphique de référence.

   Le navigateur utilisera la durée réelle du WAV
   dès que ses métadonnées seront chargées.
*/

const REFERENCE_DURATION =
    161;


/* =========================================================
   ÉLÉMENTS
   ========================================================= */

const film =
    document.getElementById("film");


const audio =
    document.getElementById("masterAudio");


const waveform =
    document.getElementById("waveform");


const playhead =
    document.getElementById("playhead");


const audioTime =
    document.getElementById("audioTime");


const scriptText =
    document.getElementById("scriptText");


const playIndicator =
    document.querySelector(".play-indicator");


const playButton =
    document.getElementById("playButton");


const pauseButton =
    document.getElementById("pauseButton");


const restartButton =
    document.getElementById("restartButton");


/* =========================================================
   SCALE

   Le master reste toujours 1080 × 1920.
   Le navigateur ne fait que réduire son affichage.
   ========================================================= */

function scaleFilm() {

    const masterWidth =
        1080;


    const masterHeight =
        1920;


    const scaleX =
        window.innerWidth / masterWidth;


    const scaleY =
        window.innerHeight / masterHeight;


    const scale =
        Math.min(
            scaleX,
            scaleY
        );


    film.style.transform =
        `scale(${scale})`;
}


window.addEventListener(
    "resize",
    scaleFilm
);


scaleFilm();


/* =========================================================
   AUDIOGRAMME PROVISOIRE

   EXACTEMENT LE MÊME PRINCIPE QUE V0.2.

   Il ne représente PAS le WAV.

   Le véritable audiogramme sera fabriqué
   après l'enregistrement de la vraie voix.
   ========================================================= */

const heights = [

    12,18,26,38,52,31,20,44,55,36,
    22,16,29,48,54,41,25,19,33,51,

    42,28,17,23,39,55,46,30,21,14,
    28,43,52,36,24,18,31,49,55,40,

    27,16,25,38,50,44,32,20,14,29,
    47,55,39,25,17,30,42,51,35,22,

    15,27,46,53,37,24,18,32,48,41,
    26,16,23,39,54,45,31,20,14,28,

    43,52,36,24,17,30,49,55,40,27,

    18,30,47,52,34,22,16,29,45,53,
    38,24,19,33,48,42,27,17,26,41,

    31,48,54,39,23,16,27,43,51,35,
    21,15,29,46,55,37,24,18,33,49

];


heights.forEach(height => {

    const bar =
        document.createElement("div");


    bar.className =
        "bar";


    bar.style.height =
        height + "px";


    waveform.appendChild(bar);

});


/* =========================================================
   NARRATION V0.3

   PREMIÈRE GRILLE DE TRAVAIL.

   IMPORTANT :
   ces timings sont provisoires.

   Ils seront recalés sur :
   1. la maquette de voix,
   puis
   2. la vraie voix de Thomas.

   Les textes sont volontairement divisés
   en blocs graphiques et non en sous-titres
   mot à mot.
   ========================================================= */

const narration = [

    {
        start: 0.0,
        end: 6.0,
        text:

    },

    {

    {
        start: 12.0,

        text:
            "ET LE BRUIT..."
    },

    {
        start: 17.5,
        end: 23.5,
        text:

    },

    {
        start: 23.5,
        end: 29.0,
        text:

    },

    {

        end: 34.0,

    },

    {
        start: 34.0,
        end: 41.0,
        text:
            "J'AI FAIT DU PUNK,<br>DU SURF-ROCK."
    },

    {
        start: 41.0,
        end: 48.0,
        text:
            "ON A ÉTÉ SIGNÉS<br>PAR YAROL POUPAUD."
    },

    {
        start: 48.0,
        end: 53.5,
        text:
            "UNE ÉQUIPE<br>DE BÉBÉS ROCKEURS."
    },

    {
        start: 53.5,
        end: 59.5,
        text:
            "J'AI JOUÉ AVEC<br>DES GENS CONNUS."
    },

    {
        start: 59.5,
        end: 64.0,
        text:
            "COMME<br>MICHEL GONDRY."
    },

    {
        start: 64.0,
        end: 70.5,
        text:
            "CLARA LUCIANI M'A FAIT<br>TENIR LA BASSE."
    },

    {
        start: 70.5,
        end: 77.0,
        text:

    },

    {
        start: 77.0,

        text:

/* =========================================================
   CHANGEMENT DE BLOC NARRATIF

   On mémorise l'index courant afin de ne pas
   relancer l'animation à chaque frame.
   ========================================================= */

let currentNarrationIndex =
    -1;


function getNarrationIndex(time) {

    return narration.findIndex(block =>

        time >= block.start &&
        time < block.end

    );

}


function showNarration(index) {

    if (
        index === currentNarrationIndex
    ) {
        return;
    }


    currentNarrationIndex =
        index;


    /*
       Aucun bloc :
       on laisse la zone respirer.
    */

    if (index === -1) {

        gsap.to(
            scriptText,
            {
                opacity: 0,
                y: 8,
                duration: 0.18
            }
        );

        return;
    }


    const block =
        narration[index];


    /*
       Sortie courte de l'ancien bloc.
    */

    gsap.to(
        scriptText,
        {
            opacity: 0,
            y: -8,

            duration: 0.12,

            overwrite: true,

            onComplete: () => {

                scriptText.innerHTML =
                    block.text;


                gsap.set(
                    scriptText,
                    {
                        y: 10
                    }
                );


                gsap.to(
                    scriptText,
                    {
                        opacity: 1,
                        y: 0,

                        duration: 0.22,

                        ease: "power2.out"
                    }
                );

            }
        }
    );

}


/* =========================================================
   TIMELINE VISUELLE V0.3

   On conserve le langage de mouvement de la V0.2.

   Différence fondamentale :
   cette timeline ne se lit plus toute seule.

   Elle est synchronisée en permanence
   sur audio.currentTime.
   ========================================================= */

const visualTimeline =
    gsap.timeline({

        paused: true,

        defaults: {
            overwrite: "auto"
        }

    });


/* ---------------------------------------------------------
   00:00 → ~00:04
   Respiration des contenus
   --------------------------------------------------------- */

visualTimeline.to(
    ".main-image .media-placeholder",
    {
        scale: 1.04,

        duration: BAR * 2,

        ease: "sine.inOut"
    },
    0
);


visualTimeline.to(
    ".video .media-placeholder",
    {
        scale: 1.06,

        duration: BAR * 2,

        ease: "sine.inOut"
    },
    0
);


visualTimeline.to(
    ".document .media-placeholder",

/* =========================================================
   IMPORTANT

   Pour V0.3, le cycle visuel de V0.2 est répété
   sur la durée de la maquette.

   Plus tard, nous remplacerons cette répétition
   par de vrais événements liés aux archives :
   Michel Gondry, Clara Luciani, groupes,
   machines, pochettes, etc.
   ========================================================= */

const VISUAL_CYCLE =
    BAR * 8;


/* =========================================================
   FORMATAGE TIMECODE

   Exemple :
   48.22 secondes -> 00:48.22
   ========================================================= */

function formatTime(seconds) {

    if (
        !Number.isFinite(seconds) ||
        seconds < 0
    ) {
        seconds = 0;
    }


    const minutes =
        Math.floor(seconds / 60);


    const secs =
        Math.floor(seconds % 60);


    const hundredths =
        Math.floor(
            (seconds % 1) * 100
        );


    return (
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(secs).padStart(2, "0")
        +
        "."
        +
        String(hundredths).padStart(2, "0")
    );

}


/* =========================================================
   DURÉE RÉELLE

   Dès que le WAV est chargé, sa durée réelle
   remplace les 161 secondes de référence.
   ========================================================= */

function getDuration() {

    if (
        Number.isFinite(audio.duration) &&
        audio.duration > 0
    ) {
        return audio.duration;
    }


    return REFERENCE_DURATION;

}


/* =========================================================
   SYNCHRONISATION PRINCIPALE

   audio.currentTime est l'horloge maîtresse.

   Cette fonction pilote :
   - timecode
   - playhead
   - narration
   - animation des fenêtres
   ========================================================= */

function syncFilm() {

    const time =
        audio.currentTime || 0;


    const duration =
        getDuration();


    /* ------------------------------------------------------
       TIMECODE
       ------------------------------------------------------ */

    audioTime.textContent =
        `${formatTime(time)} / ${formatTime(duration)}`;


    /* ------------------------------------------------------
       PLAYHEAD
       ------------------------------------------------------ */

    const progress =
        Math.max(
            0,
            Math.min(
                1,
                time / duration
            )
        );


    const waveformWidth =
        waveform.clientWidth;


    const playheadX =
        progress * waveformWidth;


    playhead.style.left =
        playheadX + "px";


    /* ------------------------------------------------------
       NARRATION
       ------------------------------------------------------ */

    const narrationIndex =
        getNarrationIndex(time);


    showNarration(
        narrationIndex
    );


    /* ------------------------------------------------------
       MOUVEMENTS DES FENÊTRES

       On reprend le cycle de V0.2,
       mais il est maintenant asservi au WAV.
       ------------------------------------------------------ */

    const cycleTime =
        time % VISUAL_CYCLE;


    visualTimeline.time(
        cycleTime,
        false
    );


    /* ------------------------------------------------------
       Continuer tant que le WAV joue
       ------------------------------------------------------ */

    if (!audio.paused) {

        requestAnimationFrame(
            syncFilm
        );

    }

}


/* =========================================================
   PLAY
   ========================================================= */

playButton.addEventListener(
    "click",
    async (event) => {

        event.stopPropagation();


        try {

            await audio.play();


            gsap.to(
                playIndicator,
                {
                    opacity: 0.45,
                    duration: 0.2
                }
            );


            requestAnimationFrame(
                syncFilm
            );

        }

        catch (error) {

            console.error(
                "Lecture audio impossible :",
                error
            );

        }

    }
);


/* =========================================================
   PAUSE
   ========================================================= */

pauseButton.addEventListener(
    "click",
    (event) => {

        event.stopPropagation();


        audio.pause();


        gsap.to(
            playIndicator,
            {
                opacity: 0.15,
                duration: 0.2
            }
        );


        syncFilm();

    }
);


/* =========================================================
   RESTART

   Retour à 00:00 puis lecture.
   ========================================================= */

restartButton.addEventListener(
    "click",
    async (event) => {

        event.stopPropagation();


        audio.pause();


        audio.currentTime =
            0;


        currentNarrationIndex =
            -1;


        syncFilm();


        try {

            await audio.play();


            gsap.to(
                playIndicator,
                {
                    opacity: 0.45,
                    duration: 0.2
                }
            );


            requestAnimationFrame(
                syncFilm
            );

        }

        catch (error) {

            console.error(
                "Lecture audio impossible :",
                error
            );

        }

    }
);


/* =========================================================
   SCRUB

   On peut cliquer dans l'audiogramme provisoire
   pour se déplacer dans la maquette.

   Très utile pour travailler la V0.3.
   ========================================================= */

waveform.addEventListener(
    "click",
    (event) => {

        const rect =
            waveform.getBoundingClientRect();


        const x =
            event.clientX - rect.left;


        const ratio =
            Math.max(
                0,
                Math.min(
                    1,
                    x / rect.width
                )
            );


        audio.currentTime =
            ratio * getDuration();


        currentNarrationIndex =
            -1;


        syncFilm();

    }
);


/* =========================================================
   MÉTADONNÉES AUDIO CHARGÉES
   ========================================================= */

audio.addEventListener(
    "loadedmetadata",
    () => {

        syncFilm();

    }
);


/* =========================================================
   SEEK

   Permet au film de se remettre immédiatement
   au bon état lorsqu'on change de position.
   ========================================================= */

audio.addEventListener(
    "seeked",
    () => {

        currentNarrationIndex =
            -1;


        syncFilm();

    }
);


/* =========================================================
   FIN
   ========================================================= */

audio.addEventListener(
    "ended",
    () => {

        gsap.to(
            playIndicator,
            {
                opacity: 0,
                duration: 0.5
            }
        );


        syncFilm();

    }
);


/* =========================================================
   ÉTAT INITIAL
   ========================================================= */

visualTimeline.pause(0);

syncFilm();
