<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mon expérience dans la musique — v0.2</title>

<!-- ========================================================
     GSAP
     Moteur d'animation des fenêtres
     ======================================================== -->

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>


<style>

/* =========================================================
   MON EXPÉRIENCE DANS LA MUSIQUE
   V0.2 — FENÊTRES ANIMÉES

   MASTER : 1080 × 1920
   TEMPO  : 124 BPM
   DURÉE FINALE : 02:41

   TEST V0.2 :
   8 mesures / environ 15.48 secondes

   SAFE ZONE :
   gauche : 80 px
   droite : 180 px
   haut   : 90 px
   bas    : 220 px

   RÈGLE :
   - toute l'interface reste dans la safe zone
   - tous les cadres restent dans la safe zone
   - les contenus peuvent être recadrés dans leurs cadres
   - la grille V0.1 reste l'état de départ
   ========================================================= */


/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
}


html,
body {
    margin: 0;

    width: 100%;
    height: 100%;

    background: #d8d8d8;

    overflow: hidden;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;
}


/* =========================================================
   VIEWPORT
   ========================================================= */

.viewport {
    width: 100vw;
    height: 100vh;

    display: flex;

    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* =========================================================
   MASTER 1080 × 1920
   ========================================================= */

#film {
    position: relative;

    width: 1080px;
    height: 1920px;

    flex: 0 0 auto;

    background: #f4f2ed;
    color: #111;

    overflow: hidden;

    transform-origin: center center;

    cursor: pointer;
}


/* =========================================================
   SIGNATURE
   ========================================================= */

.signature {
    position: absolute;

    top: 20px;
    left: 20px;

    font-size: 14px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    opacity: 0.45;
}


/* =========================================================
   VERSION
   ========================================================= */

.version {
    position: absolute;

    right: 20px;
    bottom: 20px;

    font-size: 14px;

    letter-spacing: 1px;

    opacity: 0.35;
}


/* =========================================================
   SAFE AREA

   Largeur :
   1080 - 80 - 180 = 820 px
   ========================================================= */

.safe-area {
    position: absolute;

    left: 80px;
    right: 180px;

    top: 90px;
    bottom: 220px;

    min-width: 0;

    display: grid;

    grid-template-rows:
        80px
        minmax(0, 1fr)
        290px
        150px;

    gap: 28px;
}


.metadata,
.archive-zone,
.script-zone,
.audio-zone {
    width: 100%;
    max-width: 100%;

    min-width: 0;
}


/* =========================================================
   01 — HEADER
   ========================================================= */

.metadata {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    column-gap: 30px;

    align-items: start;

    overflow: hidden;

    border-top: 2px solid #111;

    padding-top: 15px;

    font-size: 20px;

    letter-spacing: 1.6px;

    text-transform: uppercase;
}


.metadata > * {
    min-width: 0;
}


.metadata-title {
    white-space: nowrap;
}


.metadata-right {
    text-align: right;

    white-space: nowrap;

    font-size: 18px;
}


/* =========================================================
   02 — ARCHIVE ZONE
   ========================================================= */

.archive-zone {
    position: relative;

    overflow: hidden;

    border-top: 1px solid #aaa;
    border-bottom: 1px solid #aaa;
}


/* =========================================================
   V0.2 — CLASSE COMMUNE DES FENÊTRES
   ========================================================= */

.window {
    transform-origin: center center;

    will-change:
        transform,
        width,
        height,
        left,
        top,
        opacity;
}


/* =========================================================
   IMAGE MAJEURE

   État initial = V0.1 validée
   ========================================================= */

.main-image {
    position: absolute;

    left: 0;
    top: 70px;

    width: 520px;
    height: 600px;

    border: 2px solid #111;

    background: #e9e7e1;

    overflow: hidden;

    z-index: 1;
}


.image-label {
    position: absolute;

    left: 0;
    top: 36px;

    z-index: 10;

    font-size: 17px;

    letter-spacing: 2px;
}


/* =========================================================
   DOCUMENT

   État initial = V0.1 validée
   ========================================================= */

.document {
    position: absolute;

    right: 0;
    top: 150px;

    width: 220px;
    height: 450px;

    border: 2px solid #111;

    background: #dedcd6;

    overflow: hidden;

    z-index: 1;
}


.document-label {
    position: absolute;

    right: 0;
    top: 116px;

    width: 220px;

    z-index: 10;

    font-size: 17px;

    letter-spacing: 2px;
}


/* =========================================================
   VIDEO

   État initial = V0.1 validée

   Superposition sur le coin inférieur droit
   de l'image majeure.
   ========================================================= */

.video {
    position: absolute;

    left: 280px;
    top: 485px;

    width: 540px;
    height: 330px;

    border: 2px solid #111;

    background: #222;
    color: #f4f2ed;

    overflow: hidden;

    z-index: 3;
}


.video-label {
    position: absolute;

    left: 280px;
    top: 451px;

    z-index: 10;

    font-size: 17px;

    letter-spacing: 2px;
}


/* =========================================================
   CONTENU INTERNE DES FENÊTRES

   Le cadre peut changer de taille.

   Son contenu peut simultanément :
   - zoomer
   - se déplacer
   - être recadré

   sans jamais sortir visuellement du cadre.
   ========================================================= */

.media-placeholder {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    transform-origin: center center;

    will-change: transform;
}


.main-image .media-placeholder {
    font-size: 28px;

    letter-spacing: 2px;
}


.document .media-placeholder {
    font-size: 22px;

    letter-spacing: 1.5px;
}


.video .media-placeholder {
    font-size: 28px;

    letter-spacing: 2px;
}


/* =========================================================
   FUTURS VRAIS MÉDIAS

   Exemple :
   <img class="media" src="...">

   Le média sera recadré à l'intérieur
   de la fenêtre.
   ========================================================= */

.media {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
}


/* =========================================================
   03 — NARRATION

   INCHANGÉE EN V0.2
   ========================================================= */

.script-zone {
    position: relative;

    overflow: hidden;

    border-top: 2px solid #111;

    padding-top: 30px;
}


.script-label {
    margin-bottom: 24px;

    font-size: 17px;

    letter-spacing: 2px;

    text-transform: uppercase;
}


.script-text {
    width: 100%;

    min-width: 0;

    font-size: 48px;

    line-height: 1.08;

    letter-spacing: -1px;

    font-weight: 600;

    text-transform: uppercase;
}


/* =========================================================
   04 — AUDIO
   ========================================================= */

.audio-zone {
    position: relative;

    overflow: hidden;

    border-top: 2px solid #111;

    padding-top: 16px;
}


/* =========================================================
   AUDIO METADATA
   ========================================================= */

.audio-meta {
    width: 100%;

    min-width: 0;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    column-gap: 24px;

    align-items: start;

    margin-bottom: 20px;

    font-size: 16px;

    letter-spacing: 1.5px;
}


.audio-meta > * {
    min-width: 0;
}


.audio-time {
    white-space: nowrap;

    text-align: right;
}


/* =========================================================
   PLACEHOLDER AUDIOGRAM
   ========================================================= */

.waveform {
    position: relative;

    width: 100%;
    max-width: 100%;

    height: 55px;

    display: flex;

    align-items: center;

    gap: 4px;

    overflow: hidden;
}


.bar {
    width: 6px;

    flex: 0 0 6px;

    background: #111;
}


/* =========================================================
   PLAYHEAD
   ========================================================= */

.playhead {
    position: absolute;

    left: 42%;

    top: 48px;

    width: 2px;
    height: 75px;

    background: #111;

    opacity: 0.7;
}


/* =========================================================
   PETITE INDICATION DE TEST V0.2

   Invisible au repos.
   ========================================================= */

.play-indicator {
    position: absolute;

    left: 20px;
    bottom: 20px;

    font-size: 14px;

    letter-spacing: 1.2px;

    opacity: 0;

    text-transform: uppercase;

    pointer-events: none;
}


/* =========================================================
   DEBUG SAFE ZONE

   Pour l'afficher :
   <main id="film" class="debug">
   ========================================================= */

#film.debug::after {
    content: "";

    position: absolute;

    left: 80px;
    right: 180px;

    top: 90px;
    bottom: 220px;

    border: 2px dashed rgba(255, 0, 0, 0.45);

    pointer-events: none;

    z-index: 999;
}
.play-button {
    position: absolute;

    left: 20px;
    bottom: 45px;

    padding: 8px 12px;

    border: 1px solid #111;

    background: transparent;
    color: #111;

    font-family: inherit;
    font-size: 14px;
    letter-spacing: 1.5px;

    cursor: pointer;

    z-index: 1000;
}

.play-button:hover {
    background: #111;
    color: #f4f2ed;
}
</style>

</head>


<body>


<div class="viewport">


<main id="film">


    <!-- =====================================================
         SIGNATURE
         ===================================================== -->

    <div class="signature">
        THOMAS BIZIEN
    </div>


    <!-- =====================================================
         VERSION
         ===================================================== -->

    <div class="version">
        V0.2
    </div>


    <!-- =====================================================
         INDICATEUR DE LECTURE
         ===================================================== -->

   <div class="play-indicator">
    PLAY / 124 BPM
</div>

<button id="playButton" class="play-button">
    ▶ PLAY
</button>

    <!-- =====================================================
         SAFE AREA
         ===================================================== -->

    <div class="safe-area">


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="metadata">


            <div class="metadata-title">
                MON EXPÉRIENCE DANS LA MUSIQUE
            </div>


            <div class="metadata-right">
                ARCHIVE_2007<br>
                2026
            </div>


        </header>


        <!-- =================================================
             ARCHIVES
             ================================================= -->

        <section class="archive-zone">


            <!-- =============================================
                 IMAGE
                 ============================================= -->

            <div class="image-label">
                01 / IMAGE
            </div>


            <div class="main-image window">

                <div class="media-placeholder">
                    IMAGE MAJEURE
                </div>

            </div>


            <!-- =============================================
                 DOCUMENT
                 ============================================= -->

            <div class="document-label">
                02 / DOCUMENT
            </div>


            <div class="document window">

                <div class="media-placeholder">
                    DOCUMENT
                </div>

            </div>


            <!-- =============================================
                 VIDEO
                 ============================================= -->

            <div class="video-label">
                03 / VIDEO
            </div>


            <div class="video window">

                <div class="media-placeholder">
                    VIDEO SD
                </div>

            </div>


        </section>


        <!-- =================================================
             SCRIPT
             ================================================= -->

        <section class="script-zone">


            <div class="script-label">
                04 / NARRATION
            </div>


            <div class="script-text">
                J'AI COMMENCÉ LA MUSIQUE<br>
                PAR LA BASSE.
            </div>


        </section>


        <!-- =================================================
             AUDIO
             ================================================= -->

        <section class="audio-zone">


            <div class="audio-meta">


                <span>
                    PARIS M'EMMERDE
                </span>


                <span class="audio-time">
                    00:48.22 / 02:41.00
                </span>


            </div>


            <div
                class="waveform"
                id="waveform"
            ></div>


            <div class="playhead"></div>


        </section>


    </div>


</main>


</div>


<script>

/* =========================================================
   SCALE

   Le master reste toujours en 1080 × 1920.

   Le navigateur ne fait que réduire
   son affichage.
   ========================================================= */

function scaleFilm() {

    const film =
        document.getElementById("film");


    const masterWidth =
        1080;


    const masterHeight =
        1920;


    const scaleX =
        window.innerWidth / masterWidth;


    const scaleY =
        window.innerHeight / masterHeight;


    const scale =
        Math.min(scaleX, scaleY);


    film.style.transform =
        `scale(${scale})`;
}


window.addEventListener(
    "resize",
    scaleFilm
);


scaleFilm();



/* =========================================================
   AUDIOGRAMME PROVISOIRE

   Purement graphique.

   Le vrai spectrogramme sera ajouté
   après le mix voix + musique.
   ========================================================= */

const waveform =
    document.getElementById("waveform");


const heights = [

    12,18,26,38,52,31,20,44,55,36,
    22,16,29,48,54,41,25,19,33,51,

    42,28,17,23,39,55,46,30,21,14,
    28,43,52,36,24,18,31,49,55,40,

    27,16,25,38,50,44,32,20,14,29,
    47,55,39,25,17,30,42,51,35,22,

    15,27,46,53,37,24,18,32,48,41,
    26,16,23,39,54,45,31,20,14,28,

    43,52,36,24,17,30,49,55,40,27,

    18,30,47,52,34,22,16,29,45,53,
    38,24,19,33,48,42,27,17,26,41,

    31,48,54,39,23,16,27,43,51,35,
    21,15,29,46,55,37,24,18,33,49

];


heights.forEach(height => {

    const bar =
        document.createElement("div");


    bar.className =
        "bar";


    bar.style.height =
        height + "px";


    waveform.appendChild(bar);

});



/* =========================================================
   V0.2
   TEMPO / TIMING
   ========================================================= */

/*
   124 BPM

   1 temps :
   60 / 124
   ≈ 0.48387 seconde

   1 mesure 4/4 :
   0.48387 × 4
   ≈ 1.93548 seconde

   8 mesures :
   ≈ 15.48387 secondes
*/


const BEAT =
    60 / 124;


const BAR =
    BEAT * 4;



/* =========================================================
   TIMELINE V0.2

   Elle est PAUSED au chargement.

   Un clic sur le film lance ou relance
   les huit mesures.
   ========================================================= */

const demo =
    gsap.timeline({

        paused: true,

        defaults: {
            overwrite: "auto"
        }

    });



/* =========================================================
   MESURES 1–2
   00:00 → 00:03.87

   La grille ne bouge pratiquement pas.

   Les contenus commencent simplement
   à respirer à l'intérieur des cadres.
   ========================================================= */

demo.to(
    ".main-image .media-placeholder",
    {
        scale: 1.04,

        duration: BAR * 2,

        ease: "sine.inOut"
    },
    0
);


demo.to(
    ".video .media-placeholder",
    {
        scale: 1.06,

        duration: BAR * 2,

        ease: "sine.inOut"
    },
    0
);


demo.to(
    ".document .media-placeholder",
    {
        scale: 1.025,

        duration: BAR * 2,

        ease: "sine.inOut"
    },
    0
);



/* =========================================================
   MESURES 3–4
   00:03.87 → 00:07.74

   IMAGE MAJEURE prend davantage de poids.

   Le document se resserre légèrement.

   Toutes les fenêtres restent
   dans la safe zone.
   ========================================================= */

demo.to(
    ".main-image",
    {
        width: 580,
        height: 640,

        duration: BAR,

        ease: "power3.inOut"
    },
    BAR * 2
);


demo.to(
    ".main-image .media-placeholder",
    {
        scale: 1.10,
        x: -12,

        duration: BAR * 2,

        ease: "sine.inOut"
    },
    BAR * 2
);


demo.to(
    ".document",
    {
        width: 190,

        duration: BAR,

        ease: "power3.inOut"
    },
    BAR * 2
);


demo.to(
    ".document .media-placeholder",
    {
        scale: 1.08,
        x: 8,

        duration: BAR * 2,

        ease: "sine.inOut"
    },
    BAR * 2
);


demo.to(
    ".document",
    {
        opacity: 0.72,

        duration: BAR,

        ease: "power2.inOut"
    },
    BAR * 3
);



/* =========================================================
   MESURES 5–6
   00:07.74 → 00:11.61

   VIDEO devient dominante.

   IMPORTANT :
   sa limite droite reste à 820 px.

   left 180 + width 640 = 820
   ========================================================= */

demo.to(
    ".video",
    {
        left: 180,
        top: 430,

        width: 640,
        height: 360,

        duration: BAR,

        ease: "power3.inOut"
    },
    BAR * 4
);


demo.to(
    ".video .media-placeholder",
    {
        scale: 1.14,
        x: -16,

        duration: BAR * 2,

        ease: "sine.inOut"
    },
    BAR * 4
);


demo.to(
    ".main-image",
    {
        width: 470,
        height: 560,

        duration: BAR,

        ease: "power3.inOut"
    },
    BAR * 4
);


demo.to(
    ".main-image .media-placeholder",
    {
        scale: 1.06,
        x: 10,

        duration: BAR * 2,

        ease: "sine.inOut"
    },
    BAR * 4
);



/* =========================================================
   MESURES 7–8
   00:11.61 → 00:15.48

   Retour exact à la composition V0.1.
   ========================================================= */

demo.to(
    ".main-image",
    {
        width: 520,
        height: 600,

        duration: BAR * 2,

        ease: "power3.inOut"
    },
    BAR * 6
);


demo.to(
    ".document",
    {
        width: 220,
        opacity: 1,

        duration: BAR * 2,

        ease: "power3.inOut"
    },
    BAR * 6
);


demo.to(
    ".video",
    {
        left: 280,
        top: 485,

        width: 540,
        height: 330,

        duration: BAR * 2,

        ease: "power3.inOut"
    },
    BAR * 6
);


demo.to(
    ".main-image .media-placeholder",
    {
        scale: 1,
        x: 0,

        duration: BAR * 2,

        ease: "power2.inOut"
    },
    BAR * 6
);


demo.to(
    ".document .media-placeholder",
    {
        scale: 1,
        x: 0,

        duration: BAR * 2,

        ease: "power2.inOut"
    },
    BAR * 6
);


demo.to(
    ".video .media-placeholder",
    {
        scale: 1,
        x: 0,

        duration: BAR * 2,

        ease: "power2.inOut"
    },
    BAR * 6
);



/* =========================================================
   INDICATEUR PLAY
   ========================================================= */

const playIndicator =
    document.querySelector(".play-indicator");


demo.eventCallback(
    "onStart",
    () => {

        gsap.to(
            playIndicator,
            {
                opacity: 0.45,
                duration: 0.2
            }
        );

    }
);


demo.eventCallback(
    "onComplete",
    () => {

        gsap.to(
            playIndicator,
            {
                opacity: 0,
                duration: 0.5
            }
        );

    }
);



/* =========================================================
   CLIC = PLAY / REPLAY

   Chaque clic :
   - remet la timeline à zéro
   - restaure son état initial
   - relance les 8 mesures
   ========================================================= */

const film =
    document.getElementById("film");


const playButton =
    document.getElementById("playButton");

playButton.addEventListener(
    "click",
    (event) => {

        event.stopPropagation();

        demo.restart();

    }
);

</script>


</body>

</html>
